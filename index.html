<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>LogiDist Pro | Enterprise Distribution & Delivery Management</title>
    <script>
      // Apply the persisted theme before first paint to avoid a flash of
      // the incorrect theme (FOUC). Mirrors the logic in useThemeStore.ts.
      (function () {
        try {
          var mode = localStorage.getItem('logidist-theme') || 'system';
          var isDark =
            mode === 'dark' ||
            (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var root = document.documentElement;
          if (isDark) root.classList.add('dark');
          root.style.colorScheme = isDark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
